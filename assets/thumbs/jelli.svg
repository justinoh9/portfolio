<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#1a1420"/>
    </linearGradient>
    <linearGradient id="jacc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b81"/>
      <stop offset="1" stop-color="#c9385a"/>
    </linearGradient>
    <linearGradient id="jart1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#9a7cff"/>
    </linearGradient>
    <linearGradient id="jart2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd08b"/>
      <stop offset="1" stop-color="#2b8ea8"/>
    </linearGradient>
    <radialGradient id="jglow" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ff6b81" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6b81" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#jbg)"/>
  <rect width="800" height="500" fill="url(#jglow)"/>

  <!-- phone: ranked list -->
  <g transform="translate(70,60)">
    <rect x="0" y="0" width="240" height="380" rx="28" fill="#0a0e18" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="44" fill="#e8eefb" font-size="17" font-weight="700">Your ranked list</text>
    <rect x="20" y="56" width="52" height="4" rx="2" fill="url(#jacc)"/>

    <g transform="translate(20,76)">
      <rect width="200" height="52" rx="12" fill="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="32" height="32" rx="7" fill="url(#jart1)"/>
      <rect x="54" y="17" width="88" height="7" rx="3.5" fill="rgba(255,255,255,0.42)"/>
      <rect x="54" y="30" width="56" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <text x="196" y="32" fill="#ff8fa0" font-size="15" font-weight="700" text-anchor="end">9.4</text>
    </g>
    <g transform="translate(20,136)">
      <rect width="200" height="52" rx="12" fill="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="32" height="32" rx="7" fill="url(#jart2)"/>
      <rect x="54" y="17" width="72" height="7" rx="3.5" fill="rgba(255,255,255,0.42)"/>
      <rect x="54" y="30" width="46" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <text x="196" y="32" fill="#ff8fa0" font-size="15" font-weight="700" text-anchor="end">9.1</text>
    </g>
    <g transform="translate(20,196)">
      <rect width="200" height="52" rx="12" fill="rgba(255,107,129,0.12)" stroke="rgba(255,107,129,0.42)"/>
      <rect x="10" y="10" width="32" height="32" rx="7" fill="url(#jacc)"/>
      <rect x="54" y="17" width="94" height="7" rx="3.5" fill="rgba(255,214,222,0.6)"/>
      <rect x="54" y="30" width="60" height="6" rx="3" fill="rgba(255,214,222,0.35)"/>
      <text x="196" y="32" fill="#ffd6de" font-size="15" font-weight="700" text-anchor="end">8.8</text>
    </g>
    <g transform="translate(20,256)">
      <rect width="200" height="52" rx="12" fill="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="32" height="32" rx="7" fill="rgba(255,255,255,0.16)"/>
      <rect x="54" y="17" width="80" height="7" rx="3.5" fill="rgba(255,255,255,0.42)"/>
      <rect x="54" y="30" width="50" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
      <text x="196" y="32" fill="#98a4b8" font-size="15" font-weight="700" text-anchor="end">8.2</text>
    </g>

    <rect x="20" y="326" width="200" height="36" rx="18" fill="rgba(255,107,129,0.14)" stroke="rgba(255,107,129,0.4)"/>
    <text x="120" y="349" fill="#ffd6de" font-size="13" font-weight="600" text-anchor="middle">Log an album</text>
  </g>

  <!-- head-to-head mechanic -->
  <g transform="translate(370,84)">
    <text x="0" y="0" fill="#98a4b8" font-size="13" letter-spacing="2" font-weight="600">THE RANKING ENGINE</text>

    <g transform="translate(0,26)">
      <rect width="370" height="150" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,107,129,0.35)"/>
      <text x="20" y="32" fill="#e8eefb" font-size="15" font-weight="600">Which do you prefer?</text>

      <g transform="translate(20,48)">
        <rect width="150" height="82" rx="12" fill="rgba(122,162,255,0.12)" stroke="rgba(122,162,255,0.35)"/>
        <rect x="14" y="14" width="42" height="42" rx="8" fill="url(#jart1)"/>
        <rect x="68" y="22" width="66" height="7" rx="3.5" fill="rgba(219,229,246,0.55)"/>
        <rect x="68" y="35" width="44" height="6" rx="3" fill="rgba(219,229,246,0.3)"/>
        <rect x="14" y="64" width="80" height="6" rx="3" fill="rgba(219,229,246,0.25)"/>
      </g>

      <text x="185" y="97" fill="#98a4b8" font-size="13" font-weight="700" text-anchor="middle">vs</text>

      <g transform="translate(200,48)">
        <rect width="150" height="82" rx="12" fill="rgba(63,208,139,0.12)" stroke="rgba(63,208,139,0.32)"/>
        <rect x="14" y="14" width="42" height="42" rx="8" fill="url(#jart2)"/>
        <rect x="68" y="22" width="60" height="7" rx="3.5" fill="rgba(214,255,235,0.55)"/>
        <rect x="68" y="35" width="40" height="6" rx="3" fill="rgba(214,255,235,0.3)"/>
        <rect x="14" y="64" width="72" height="6" rx="3" fill="rgba(214,255,235,0.25)"/>
      </g>
    </g>

    <text x="0" y="206" fill="#c3cbd9" font-size="13">Score does the coarse sort.</text>
    <text x="0" y="226" fill="#c3cbd9" font-size="13">Head-to-heads break the ties.</text>

    <g transform="translate(0,248)">
      <rect width="176" height="38" rx="19" fill="rgba(255,107,129,0.12)" stroke="rgba(255,107,129,0.4)"/>
      <circle cx="22" cy="19" r="5" fill="#ff6b81"/>
      <text x="38" y="24" fill="#ffd6de" font-size="13" font-weight="600">Live · myjelli.site</text>
    </g>
    <g transform="translate(190,248)">
      <rect width="180" height="38" rx="19" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="18" y="24" fill="#dbe5f6" font-size="13" font-weight="600">iOS · Android · Web</text>
    </g>
  </g>
</svg>
